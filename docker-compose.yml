services:
  ssp-app:
    image: ghcr.io/didier57/ssp-app:latest
    container_name: ssp-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-avec-une-longue-cle-secrete}
      - PORT=3001
      - DB_PATH=/data/ssp.db
      - TZ=Europe/Paris
    volumes:
      # Chemin absolu du dossier de données sur le NAS (contient la BDD)
      - ${DATA_DIR:-/volume1/docker/ssp-app/data}:/data